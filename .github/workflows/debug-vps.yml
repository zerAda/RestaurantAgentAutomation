name: Debug VPS Connectivity
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Traceroute and Ping to VPS
        run: |
          sudo apt-get update && sudo apt-get install -y traceroute
          echo "=> Pinging VPS"
          ping -c 4 72.60.190.192 || true
          echo "=> Tracerouting VPS"
          traceroute 72.60.190.192 || true
          echo "=> Netcat VPS port 22"
          nc -zv 72.60.190.192 22 || true
