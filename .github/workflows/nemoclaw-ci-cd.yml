name: Nemoclaw CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'nemoclaw/**'
      - '.github/workflows/nemoclaw-ci-cd.yml'

defaults:
  run:
    working-directory: nemoclaw

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "nemoclaw/docker-compose.yml"
          target: "/opt/nemoclaw"
          strip_components: 1

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/nemoclaw
            docker compose pull || true
            docker compose up -d --remove-orphans
