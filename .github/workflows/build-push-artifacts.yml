name: Build and Push Artifacts (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push CMS
        uses: docker/build-push-action@v5
        with:
          context: ./inventory-cms
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/resto-bot-cms:latest,${{ env.REGISTRY }}/${{ github.repository_owner }}/resto-bot-cms:${{ github.sha }}

      - name: Build and push Admin Dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./admin-dashboard/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/resto-bot-admin:latest,${{ env.REGISTRY }}/${{ github.repository_owner }}/resto-bot-admin:${{ github.sha }}

      - name: Build and push Kiosk App
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./kiosk-app/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/resto-bot-kiosk:latest,${{ env.REGISTRY }}/${{ github.repository_owner }}/resto-bot-kiosk:${{ github.sha }}
