# =============================================================================
# CI - Build & Push Artifacts to GHCR (Premium Grade)
# =============================================================================
# This workflow replaces rsync-based deployment with immutable container artifacts.
# Images are built, tagged with version+SHA, and pushed to GitHub Container Registry.
# The CD pipeline then pulls these pre-built, tested images instead of syncing raw code.
#
# Benefits:
# - Immutable deployments (what's tested in CI is exactly what's deployed)
# - Faster deployments (no build on VPS, just pull)
# - Rollback via image tags
# - Supply-chain security (signed artifacts)
# - Multi-arch support (amd64/arm64)
# =============================================================================

name: CI - Build & Push Artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write  # Required for GHCR push
  id-token: write  # For provenance/SBOM

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/resto-bot

jobs:
  # ===========================================================================
  # JOB 1: Build metadata (version, tags, manifest)
  # ===========================================================================
  metadata:
    name: Generate Build Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha_short: ${{ steps.meta.outputs.sha_short }}
      build_date: ${{ steps.meta.outputs.build_date }}
      tags_cms: ${{ steps.meta.outputs.tags_cms }}
      tags_admin: ${{ steps.meta.outputs.tags_admin }}
      tags_kiosk: ${{ steps.meta.outputs.tags_kiosk }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate metadata
        id: meta
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "0.0.0")
          SHA_SHORT=${GITHUB_SHA::7}
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

          # Generate tags for each image
          # Format: ghcr.io/owner/resto-bot-cms:v1.2.3, ghcr.io/owner/resto-bot-cms:sha-abc1234, ghcr.io/owner/resto-bot-cms:latest
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}"

          echo "tags_cms=${BASE}-cms:v${VERSION},${BASE}-cms:sha-${SHA_SHORT},${BASE}-cms:latest" >> $GITHUB_OUTPUT
          echo "tags_admin=${BASE}-admin:v${VERSION},${BASE}-admin:sha-${SHA_SHORT},${BASE}-admin:latest" >> $GITHUB_OUTPUT
          echo "tags_kiosk=${BASE}-kiosk:v${VERSION},${BASE}-kiosk:sha-${SHA_SHORT},${BASE}-kiosk:latest" >> $GITHUB_OUTPUT

          echo "Build metadata:"
          echo "  Version: v${VERSION}"
          echo "  SHA: ${SHA_SHORT}"
          echo "  Date: ${BUILD_DATE}"

  # ===========================================================================
  # JOB 2: Build & Push CMS (Strapi)
  # ===========================================================================
  build-cms:
    name: Build & Push CMS
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CMS image
        uses: docker/build-push-action@v6
        with:
          context: ./inventory-cms
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ needs.metadata.outputs.tags_cms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Resto Bot CMS
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.metadata.outputs.build_date }}
          provenance: true
          sbom: true

  # ===========================================================================
  # JOB 3: Build & Push Admin Dashboard
  # ===========================================================================
  build-admin:
    name: Build & Push Admin Dashboard
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Admin Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./admin-dashboard/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ needs.metadata.outputs.tags_admin }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Resto Bot Admin Dashboard
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.metadata.outputs.build_date }}
          provenance: true
          sbom: true

  # ===========================================================================
  # JOB 4: Build & Push Kiosk App
  # ===========================================================================
  build-kiosk:
    name: Build & Push Kiosk App
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Kiosk App image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./kiosk-app/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ needs.metadata.outputs.tags_kiosk }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Resto Bot Kiosk App
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.metadata.outputs.build_date }}
          provenance: true
          sbom: true

  # ===========================================================================
  # JOB 5: Create deployment manifest
  # ===========================================================================
  create-manifest:
    name: Create Deployment Manifest
    runs-on: ubuntu-latest
    needs: [metadata, build-cms, build-admin, build-kiosk]
    if: github.event_name != 'pull_request'
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate deployment manifest
        run: |
          cat > deployment-manifest.json << EOF
          {
            "version": "${{ needs.metadata.outputs.version }}",
            "commit": "${{ github.sha }}",
            "sha_short": "${{ needs.metadata.outputs.sha_short }}",
            "build_date": "${{ needs.metadata.outputs.build_date }}",
            "actor": "${{ github.actor }}",
            "workflow_run": "${{ github.run_id }}",
            "images": {
              "cms": "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-cms:sha-${{ needs.metadata.outputs.sha_short }}",
              "admin": "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin:sha-${{ needs.metadata.outputs.sha_short }}",
              "kiosk": "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-kiosk:sha-${{ needs.metadata.outputs.sha_short }}",
              "n8n": "docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}",
              "postgres": "postgres:15-alpine",
              "redis": "redis:7-alpine",
              "traefik": "traefik:v3.6.6",
              "adminer": "adminer:4-standalone",
              "nginx": "nginx:1.27-alpine"
            }
          }
          EOF

          cat deployment-manifest.json

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest-${{ needs.metadata.outputs.sha_short }}
          path: deployment-manifest.json
          retention-days: 90

  # ===========================================================================
  # JOB 6: Summary
  # ===========================================================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [metadata, build-cms, build-admin, build-kiosk, create-manifest]
    if: always()
    timeout-minutes: 2

    steps:
      - name: Generate summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 📦 Artifact Build Summary

          | Component | Status | Tag |
          |-----------|--------|-----|
          | **CMS** | ${{ needs.build-cms.result }} | `sha-${{ needs.metadata.outputs.sha_short }}` |
          | **Admin Dashboard** | ${{ needs.build-admin.result }} | `sha-${{ needs.metadata.outputs.sha_short }}` |
          | **Kiosk App** | ${{ needs.build-kiosk.result }} | `sha-${{ needs.metadata.outputs.sha_short }}` |
          | **Manifest** | ${{ needs.create-manifest.result }} | ✅ Created |

          ### Image URLs
          ```
          ghcr.io/${{ env.IMAGE_PREFIX }}-cms:v${{ needs.metadata.outputs.version }}
          ghcr.io/${{ env.IMAGE_PREFIX }}-admin:v${{ needs.metadata.outputs.version }}
          ghcr.io/${{ env.IMAGE_PREFIX }}-kiosk:v${{ needs.metadata.outputs.version }}
          ```

          ### Pull Command
          ```bash
          docker pull ghcr.io/${{ env.IMAGE_PREFIX }}-cms:sha-${{ needs.metadata.outputs.sha_short }}
          docker pull ghcr.io/${{ env.IMAGE_PREFIX }}-admin:sha-${{ needs.metadata.outputs.sha_short }}
          docker pull ghcr.io/${{ env.IMAGE_PREFIX }}-kiosk:sha-${{ needs.metadata.outputs.sha_short }}
          ```

          **Build Date:** ${{ needs.metadata.outputs.build_date }}
          **Commit:** `${{ github.sha }}`
          **Version:** `v${{ needs.metadata.outputs.version }}`
          EOF
