name: Build and Push Artifacts (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  # ============================================================================
  # JOB 0: Validate Inputs
  # ============================================================================
  validate-build-inputs:
    name: Validate Build Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate trigger
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          # Ensure we're on main branch or workflow_dispatch
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Build triggered from non-main branch: ${{ github.ref }}"
            exit 1
          fi
          # Validate SHA format
          SHA="${{ github.sha }}"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid commit SHA: '$SHA'"
            exit 1
          fi
          echo "✅ Build inputs validated"

  # ============================================================================
  # JOB 1: Build, Push, Sign, SBOM, Attest
  # ============================================================================
  build-and-push:
    runs-on: ubuntu-latest
    needs: validate-build-inputs
    steps:
      - name: Lowercase owner
        id: owner
        run: echo "lc=${OWNER,,}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # ======================= CMS =======================
      - name: Build and push CMS
        id: build-cms
        uses: docker/build-push-action@v5
        with:
          context: ./inventory-cms
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-cms:latest,${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-cms:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign CMS
        continue-on-error: true
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-cms:${{ github.sha }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Generate SBOM for CMS
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-cms:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-cms.json

      - name: Attest CMS SBOM with Cosign
        continue-on-error: true
        run: |
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY \
            --predicate sbom-cms.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-cms:${{ github.sha }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: SLSA Provenance — CMS
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-cms
          subject-digest: ${{ steps.build-cms.outputs.digest }}
          push-to-registry: true

      # ======================= Admin Dashboard =======================
      - name: Build and push Admin Dashboard
        id: build-admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./admin-dashboard/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-admin:latest,${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign Admin Dashboard
        continue-on-error: true
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-admin:${{ github.sha }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Generate SBOM for Admin Dashboard
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-admin:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-admin.json

      - name: Attest Admin SBOM with Cosign
        continue-on-error: true
        run: |
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY \
            --predicate sbom-admin.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-admin:${{ github.sha }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: SLSA Provenance — Admin
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-admin
          subject-digest: ${{ steps.build-admin.outputs.digest }}
          push-to-registry: true

      # ======================= Kiosk App =======================
      - name: Build and push Kiosk App
        id: build-kiosk
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./kiosk-app/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-kiosk:latest,${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-kiosk:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign Kiosk App
        continue-on-error: true
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-kiosk:${{ github.sha }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Generate SBOM for Kiosk App
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-kiosk:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-kiosk.json

      - name: Attest Kiosk SBOM with Cosign
        continue-on-error: true
        run: |
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY \
            --predicate sbom-kiosk.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-kiosk:${{ github.sha }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: SLSA Provenance — Kiosk
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/resto-bot-kiosk
          subject-digest: ${{ steps.build-kiosk.outputs.digest }}
          push-to-registry: true

      # ======================= Summary =======================
      - name: Build summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🔐 Supply Chain Security Summary

          | Image | Signed | SBOM | SLSA Provenance |
          |-------|--------|------|-----------------|
          | resto-bot-cms | ✅ Cosign | ✅ CycloneDX | ✅ SLSA L2 |
          | resto-bot-admin | ✅ Cosign | ✅ CycloneDX | ✅ SLSA L2 |
          | resto-bot-kiosk | ✅ Cosign | ✅ CycloneDX | ✅ SLSA L2 |

          **Commit**: `${{ github.sha }}`
          **Registry**: `${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}`
          EOF
