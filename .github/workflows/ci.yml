# =============================================================================
# CI Pipeline - Resto Bot (Industrial Grade)
# =============================================================================
# Dependency graph:
#   integrity-gate ──┬──► lint-validate
#                    ├──► python-tests
#                    ├──► integration-tests [matrix: pg15, pg16]
#                    ├──► docker-build [matrix: cms, admin, kiosk] (main/release only)
#                    ├──► security-scan
#                    ├──► frontend-lint [matrix: admin-dashboard, kiosk-app]
#                    ├──► test-harness (main/release only, needs: integration-tests)
#                    ├──► n8n-workflow-e2e (main/release only, needs: integrity-gate, test-harness)
#                    │         │
#                    └─────────┴──► ci-summary (needs: all, if: always())
#
# PR: integrity-gate, lint, python-tests, integration-tests (PG15), security-scan, frontend-lint
# main: all + test-harness, docker-build, matrix PG15+16
# release/*: like main + 90-day artifact retention
# =============================================================================
# Actions pinned to SHA for supply-chain security.
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "20.20.0"
  PYTHON_VERSION: "3.11"
  POSTGRES_USER: n8n
  POSTGRES_PASSWORD: n8npass
  POSTGRES_DB: n8n
  N8N_VERSION: "2.9.4"

jobs:
  # ==========================================================================
  # JOB 1: Integrity Gate (blocking — all other jobs depend on this)
  # ==========================================================================
  integrity-gate:
    name: Integrity Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install jsonschema pyyaml

      - name: Run integrity gate (10-point quality check)
        run: |
          chmod +x scripts/integrity_gate.sh
          bash scripts/integrity_gate.sh

  # ==========================================================================
  # JOB 2: Lint & Validate
  # ==========================================================================
  lint-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    needs: [integrity-gate]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate JSON workflow files
        run: |
          echo "Validating workflow JSON files..."
          ERRORS=0
          for f in workflows/*.json; do
            if ! node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))" 2>/dev/null; then
              echo "::error file=$f::Invalid JSON"
              ERRORS=$((ERRORS + 1))
            fi
          done
          COUNT=$(ls workflows/*.json | wc -l)
          echo "Checked $COUNT JSON files"
          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS JSON files are invalid"
            exit 1
          fi

      - name: Validate workflow naming convention
        run: |
          ERRORS=0
          for f in workflows/*.json; do
            BASE=$(basename "$f")
            if ! echo "$BASE" | grep -qE '^W[0-9]+_.*\.json$'; then
              echo "::warning file=$f::Does not follow W<N>_*.json naming convention"
            fi
          done

      - name: Check for placeholder values
        run: |
          if grep -rE "CHANGE_ME|REPLACE_ME" --include="*.json" workflows/ 2>/dev/null; then
            echo "::warning::Found placeholder values that should be replaced before production"
          fi

      - name: Validate bash scripts
        run: |
          ERRORS=0
          for f in scripts/*.sh; do
            if ! bash -n "$f" 2>/dev/null; then
              echo "::error file=$f::Bash syntax error"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi
          echo "All scripts valid"

      - name: Validate compose files
        run: |
          # Production compose requires env vars — provide dummy values for validation
          export DOMAIN_NAME=example.com
          export CONSOLE_SUBDOMAIN=console
          export API_SUBDOMAIN=api
          export SSL_EMAIL=test@example.com
          export TRAEFIK_TRUSTED_IPS=127.0.0.1/32
          export ADMIN_ALLOWED_IPS=127.0.0.1/32
          export N8N_VERSION=2.9.4
          export TZ=UTC
          export WEBHOOK_SHARED_TOKEN=ci-test
          export META_APP_SECRET=ci-test
          export WA_SEND_URL=http://localhost:8080/wa
          export WA_API_TOKEN=ci-test
          export IG_SEND_URL=http://localhost:8080/ig
          export IG_API_TOKEN=ci-test
          export MSG_SEND_URL=http://localhost:8080/msg
          export MSG_API_TOKEN=ci-test
          export STRAPI_ADMIN_JWT_SECRET=ci-test-secret-key-32ch
          export STRAPI_JWT_SECRET=ci-test-secret-key-32ch
          export STRAPI_API_TOKEN_SALT=ci-test-salt-value
          export STRAPI_TRANSFER_TOKEN_SALT=ci-test-salt-value
          export STRAPI_ENCRYPTION_KEY=ci-test-encryption-key
          export STRAPI_APP_KEYS=ci-test-app-key-1,ci-test-app-key-2
          export POSTGRES_USER=n8n
          # P0-01 DB Migration dummy values
          export PGPASSWORD=n8npass
          export STRAPI_DATABASE_NAME=strapi
          export GITHUB_REPOSITORY_OWNER=zerada
          export CMS_IMAGE=ghcr.io/zerada/resto-bot-cms:latest
          export ADMIN_IMAGE=ghcr.io/zerada/resto-bot-admin:latest
          export KIOSK_IMAGE=ghcr.io/zerada/resto-bot-kiosk:latest

          echo "Validating docker-compose.hostinger.prod.yml..."
          docker compose -f docker-compose.hostinger.prod.yml config > /dev/null
          echo "Production compose: OK"

          for f in docker/docker-compose*.yml; do
            if [ -f "$f" ]; then
              echo "Validating $f..."
              docker compose --project-directory . -f "$f" config > /dev/null 2>&1 || \
                docker compose -f "$f" config > /dev/null
              echo "$f: OK"
            fi
          done

  # ==========================================================================
  # JOB 3: Python Tests
  # ==========================================================================
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: [integrity-gate]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('scripts/requirements-ci.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r scripts/requirements-ci.txt

      - name: Run tests with JUnit output
        run: |
          chmod +x scripts/ci_test_runner.sh
          bash scripts/ci_test_runner.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.0
        with:
          name: python-test-results
          path: test-results/results.xml
          retention-days: ${{ startsWith(github.ref, 'refs/heads/release/') && 90 || 30 }}

  # ==========================================================================
  # JOB 4: Integration Tests (PostgreSQL matrix)
  # ==========================================================================
  integration-tests:
    name: Integration Tests (PG ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    needs: [integrity-gate]
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        postgres: ["15-alpine"]
        include:
          - postgres: "15-alpine"
            pg_major: "15"
        # PG16 tested in separate integration-tests-pg16 job (main/release only)

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: n8n
          POSTGRES_PASSWORD: n8npass
          POSTGRES_DB: n8n
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Apply bootstrap schema
        env:
          PGPASSWORD: n8npass
        run: |
          psql -h localhost -U n8n -d n8n -v ON_ERROR_STOP=1 -f db/bootstrap.sql
          # Create strapi database (needed by migration 006)
          psql -h localhost -U n8n -d postgres -c "SELECT 1 FROM pg_database WHERE datname = 'strapi'" | grep -q 1 || \
            psql -h localhost -U n8n -d postgres -c "CREATE DATABASE strapi OWNER n8n;"
          echo "Bootstrap schema applied (PG ${{ matrix.pg_major }})"

      - name: Apply all migrations
        env:
          PGPASSWORD: n8npass
        run: |
          psql -h localhost -U n8n -d n8n -v ON_ERROR_STOP=1 <<'EOSQL'
          CREATE TABLE IF NOT EXISTS schema_migrations (
            id          serial PRIMARY KEY,
            filename    text NOT NULL UNIQUE,
            applied_at  timestamptz NOT NULL DEFAULT now(),
            checksum    text NULL
          );
          EOSQL

          APPLIED=0
          WARNED=0
          for migration in $(ls -1 db/migrations/*.sql 2>/dev/null | sort); do
            filename=$(basename "$migration")
            echo "Applying: $filename"
            # Migrations with \c (cross-database) need special handling
            if grep -q '\\\\c ' "$migration"; then
              echo "::notice::Cross-database migration (contains \\c): $filename — running without ON_ERROR_STOP"
              if psql -h localhost -U n8n -d n8n < "$migration" 2>&1; then
                APPLIED=$((APPLIED + 1))
              else
                echo "::warning::Cross-database migration had issues (expected in CI): $filename"
                WARNED=$((WARNED + 1))
              fi
            elif psql -h localhost -U n8n -d n8n -v ON_ERROR_STOP=1 < "$migration"; then
              APPLIED=$((APPLIED + 1))
            else
              echo "::warning::Migration had issues (may overlap with bootstrap.sql): $filename"
              WARNED=$((WARNED + 1))
            fi
            psql -h localhost -U n8n -d n8n -c "INSERT INTO schema_migrations (filename) VALUES ('$filename') ON CONFLICT (filename) DO NOTHING;" 2>/dev/null || true
          done

          echo "::notice::Migrations: $APPLIED applied, $WARNED warnings"

      - name: Test migration idempotence
        env:
          PGPASSWORD: n8npass
        run: |
          echo "Re-applying all migrations (idempotence check)..."
          IDEMPOTENT=0
          ISSUES=0
          for migration in $(ls -1 db/migrations/*.sql 2>/dev/null | sort); do
            filename=$(basename "$migration")
            if grep -q '\\\\c ' "$migration"; then
              echo "::notice::Skipping idempotence check for cross-database migration: $filename"
              continue
            fi
            if psql -h localhost -U n8n -d n8n -v ON_ERROR_STOP=1 < "$migration" 2>/dev/null; then
              IDEMPOTENT=$((IDEMPOTENT + 1))
            else
              echo "::warning::Migration not fully idempotent: $filename"
              ISSUES=$((ISSUES + 1))
            fi
          done
          echo "::notice::Idempotence: $IDEMPOTENT passed, $ISSUES warnings"

      - name: Verify schema integrity
        env:
          PGPASSWORD: n8npass
        run: |
          EXPECTED_TABLES="tenants restaurants api_clients menu_items orders inbound_messages outbound_messages security_events schema_migrations conversation_state webhook_replay_guard admin_wa_audit_log fraud_rules payment_intents faq_entries support_tickets delivery_zones"
          MISSING=0
          for table in $EXPECTED_TABLES; do
            EXISTS=$(psql -h localhost -U n8n -d n8n -t -c "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='$table';" | tr -d ' ')
            if [ "$EXISTS" != "1" ]; then
              echo "::error::Missing table: $table"
              MISSING=$((MISSING + 1))
            fi
          done

          TOTAL=$(psql -h localhost -U n8n -d n8n -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public';" | tr -d ' ')
          echo "::notice::PG${{ matrix.pg_major }}: $TOTAL total tables, $(echo $EXPECTED_TABLES | wc -w) critical verified"
          echo "Migration records: $(psql -h localhost -U n8n -d n8n -t -c "SELECT COUNT(*) FROM schema_migrations;" | tr -d ' ')"

          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING critical tables missing"
            exit 1
          fi

          # Verify ops schema tables (Phase 3 migration — AUDIT-01)
          MISSING=0
          OPS_EXPECTED_TABLES="workflow_audit"
          for table in $OPS_EXPECTED_TABLES; do
            EXISTS=$(psql -h localhost -U n8n -d n8n -t -c "SELECT 1 FROM information_schema.tables WHERE table_schema='ops' AND table_name='$table';" | tr -d ' ')
            if [ "$EXISTS" != "1" ]; then
              echo "::error::Missing ops schema table: $table"
              MISSING=$((MISSING + 1))
            else
              echo "ops.$table: OK"
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING ops schema tables missing"
            exit 1
          fi

  # PG16 matrix entry (only on main/release branches)
  integration-tests-pg16:
    name: Integration Tests (PG 16)
    runs-on: ubuntu-latest
    needs: [integrity-gate]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: n8n
          POSTGRES_PASSWORD: n8npass
          POSTGRES_DB: n8n
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Apply bootstrap schema
        env:
          PGPASSWORD: n8npass
        run: |
          psql -h localhost -U n8n -d n8n -v ON_ERROR_STOP=1 -f db/bootstrap.sql
          # Create strapi database (needed by migration 006)
          psql -h localhost -U n8n -d postgres -c "SELECT 1 FROM pg_database WHERE datname = 'strapi'" | grep -q 1 || \
            psql -h localhost -U n8n -d postgres -c "CREATE DATABASE strapi OWNER n8n;"
          echo "Bootstrap schema applied (PG 16)"

      - name: Apply all migrations
        env:
          PGPASSWORD: n8npass
        run: |
          psql -h localhost -U n8n -d n8n -v ON_ERROR_STOP=1 <<'EOSQL'
          CREATE TABLE IF NOT EXISTS schema_migrations (
            id          serial PRIMARY KEY,
            filename    text NOT NULL UNIQUE,
            applied_at  timestamptz NOT NULL DEFAULT now(),
            checksum    text NULL
          );
          EOSQL

          APPLIED=0
          WARNED=0
          for migration in $(ls -1 db/migrations/*.sql 2>/dev/null | sort); do
            filename=$(basename "$migration")
            echo "Applying: $filename"
            # Migrations with \c (cross-database) need special handling
            if grep -q '\\\\c ' "$migration"; then
              echo "::notice::Cross-database migration (contains \\c): $filename — running without ON_ERROR_STOP"
              if psql -h localhost -U n8n -d n8n < "$migration" 2>&1; then
                APPLIED=$((APPLIED + 1))
              else
                echo "::warning::Cross-database migration had issues (expected in CI): $filename"
                WARNED=$((WARNED + 1))
              fi
            elif psql -h localhost -U n8n -d n8n -v ON_ERROR_STOP=1 < "$migration"; then
              APPLIED=$((APPLIED + 1))
            else
              echo "::warning::Migration had issues (may overlap with bootstrap.sql): $filename"
              WARNED=$((WARNED + 1))
            fi
            psql -h localhost -U n8n -d n8n -c "INSERT INTO schema_migrations (filename) VALUES ('$filename') ON CONFLICT (filename) DO NOTHING;" 2>/dev/null || true
          done

          echo "::notice::Migrations: $APPLIED applied, $WARNED warnings"

      - name: Test migration idempotence
        env:
          PGPASSWORD: n8npass
        run: |
          echo "Re-applying all migrations (idempotence check)..."
          IDEMPOTENT=0
          ISSUES=0
          for migration in $(ls -1 db/migrations/*.sql 2>/dev/null | sort); do
            filename=$(basename "$migration")
            if grep -q '\\\\c ' "$migration"; then
              echo "::notice::Skipping idempotence check for cross-database migration: $filename"
              continue
            fi
            if psql -h localhost -U n8n -d n8n -v ON_ERROR_STOP=1 < "$migration" 2>/dev/null; then
              IDEMPOTENT=$((IDEMPOTENT + 1))
            else
              echo "::warning::Migration not fully idempotent: $filename"
              ISSUES=$((ISSUES + 1))
            fi
          done
          echo "::notice::Idempotence: $IDEMPOTENT passed, $ISSUES warnings"

      - name: Verify schema integrity
        env:
          PGPASSWORD: n8npass
        run: |
          EXPECTED_TABLES="tenants restaurants api_clients menu_items orders inbound_messages outbound_messages security_events schema_migrations conversation_state webhook_replay_guard admin_wa_audit_log fraud_rules payment_intents faq_entries support_tickets delivery_zones"
          MISSING=0
          for table in $EXPECTED_TABLES; do
            EXISTS=$(psql -h localhost -U n8n -d n8n -t -c "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='$table';" | tr -d ' ')
            if [ "$EXISTS" != "1" ]; then
              echo "::error::Missing table: $table"
              MISSING=$((MISSING + 1))
            fi
          done

          TOTAL=$(psql -h localhost -U n8n -d n8n -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public';" | tr -d ' ')
          echo "::notice::PG16: $TOTAL total tables, $(echo $EXPECTED_TABLES | wc -w) critical verified"

          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING critical tables missing"
            exit 1
          fi

          # Verify ops schema tables (Phase 3 migration — AUDIT-01)
          MISSING=0
          OPS_EXPECTED_TABLES="workflow_audit"
          for table in $OPS_EXPECTED_TABLES; do
            EXISTS=$(psql -h localhost -U n8n -d n8n -t -c "SELECT 1 FROM information_schema.tables WHERE table_schema='ops' AND table_name='$table';" | tr -d ' ')
            if [ "$EXISTS" != "1" ]; then
              echo "::error::Missing ops schema table: $table"
              MISSING=$((MISSING + 1))
            else
              echo "ops.$table: OK"
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING ops schema tables missing"
            exit 1
          fi

  # ==========================================================================
  # JOB 4b: CMS TypeScript Compilation Gate
  # ==========================================================================
  cms-ts-compile:
    name: CMS TypeScript Compilation
    runs-on: ubuntu-latest
    needs: [integrity-gate]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate tsconfig module setting
        working-directory: inventory-cms
        run: |
          MODULE=$(node -e "
            const fs = require('fs');
            // Strip JSON comments before parsing
            const raw = fs.readFileSync('tsconfig.json', 'utf8').replace(/\/\/[^\n]*/g, '');
            const cfg = JSON.parse(raw);
            console.log(cfg.compilerOptions && cfg.compilerOptions.module || 'unset');
          " 2>/dev/null || echo "parse-error")
          echo "tsconfig module: $MODULE"
          if echo "$MODULE" | grep -qiE "^(ESNext|ES2022|NodeNext|ESModule)$"; then
            echo "::error file=inventory-cms/tsconfig.json::module is '$MODULE' — must be 'CommonJS' for Strapi 5 (ESM interop issue causes runtime crashes)"
            exit 1
          fi
          echo "tsconfig module setting OK: $MODULE"

      - name: Install CMS dependencies
        working-directory: inventory-cms
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript compilation check
        working-directory: inventory-cms
        run: npx tsc --noEmit

  # ==========================================================================
  # JOB 5: Docker Build (matrix — main/release only)
  # ==========================================================================
  docker-build:
    name: Docker Build (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    needs: [integrity-gate, lint-validate, cms-ts-compile]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: cms
            context: ./inventory-cms
            dockerfile: ./inventory-cms/Dockerfile
          - name: admin
            context: .
            dockerfile: ./admin-dashboard/Dockerfile
          - name: kiosk
            context: .
            dockerfile: ./kiosk-app/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and scan
        uses: ./.github/actions/docker-build-scan
        with:
          context: ${{ matrix.image.context }}
          dockerfile: ${{ matrix.image.dockerfile }}
          image-name: ${{ matrix.image.name }}
          tag-suffix: ci-${{ github.sha }}
          scan: "true"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.0
        with:
          name: trivy-scan-${{ matrix.image.name }}
          path: trivy-*.sarif
          retention-days: ${{ startsWith(github.ref, 'refs/heads/release/') && 90 || 30 }}
          if-no-files-found: ignore

  # ==========================================================================
  # JOB 6: Frontend Lint
  # ==========================================================================
  frontend-lint:
    name: Frontend Lint (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [integrity-gate]
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        app: [admin-dashboard, kiosk-app]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.npm
          key: npm-${{ matrix.app }}-${{ hashFiles(format('{0}/package-lock.json', matrix.app)) }}
          restore-keys: npm-${{ matrix.app }}-

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install --legacy-peer-deps
          else
            echo "::notice::No package-lock.json found for ${{ matrix.app }}, skipping"
          fi

      - name: Lint
        working-directory: ${{ matrix.app }}
        run: |
          if [ -f "package.json" ] && grep -q '"lint"' package.json && [ -d "node_modules" ]; then
            npm run lint
          else
            echo "::notice::Lint skipped for ${{ matrix.app }}"
          fi

      - name: Build (TypeScript + Vite check)
        working-directory: ${{ matrix.app }}
        run: |
          if [ -f "package.json" ] && grep -q '"build"' package.json; then
            npm run build
          else
            echo "::notice::No build script found in ${{ matrix.app }}/package.json"
          fi

  # ==========================================================================
  # JOB 7: Security Scan
  # ==========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [integrity-gate]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" \
            --report-format sarif --report-path gitleaks-report.sarif --verbose

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.0
        with:
          name: gitleaks-sarif
          path: gitleaks-report.sarif
          retention-days: 30
          if-no-files-found: ignore

      - name: Check .env not committed
        run: |
          if [ -f ".env" ] || [ -f "config/.env" ]; then
            echo "::error::.env file must not be committed"
            exit 1
          fi

      - name: Validate nginx security headers
        run: |
          CONF="infra/gateway/nginx.conf"
          if [ -f "$CONF" ]; then
            MISSING=0
            for header in "X-Content-Type-Options" "X-Frame-Options" "server_tokens off"; do
              if ! grep -q "$header" "$CONF"; then
                echo "::error file=$CONF::Missing: $header"
                MISSING=$((MISSING + 1))
              fi
            done
            if [ $MISSING -eq 0 ]; then
              echo "Nginx security headers: OK"
            fi
          fi

  # ==========================================================================
  # JOB 6b: Nginx Routing Smoke Tests (Phase 4 - Plan 04-01)
  # ==========================================================================
  smoke-nginx-routing:
    name: Nginx Routing Smoke
    runs-on: ubuntu-latest
    needs: [integrity-gate, lint-validate]
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run nginx routing smoke tests (burst variant)
        run: |
          chmod +x scripts/smoke-nginx-routing.sh
          bash scripts/smoke-nginx-routing.sh

  # ==========================================================================
  # JOB 6c: Strapi Permission Smoke Tests (Phase 4 - Plan 04-02)
  # ==========================================================================
  smoke-strapi-permissions:
    name: Strapi Permission Smoke
    runs-on: ubuntu-latest
    needs: [integrity-gate, lint-validate]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate smoke script syntax
        run: bash -n scripts/smoke-strapi-permissions.sh

      - name: Run Strapi permission smoke tests (dry-run)
        run: |
          echo "::notice::Strapi permission tests require a live CMS; validating script syntax only in CI"
          chmod +x scripts/smoke-strapi-permissions.sh
          # Dry-run: validate the script runs and exits cleanly
          bash scripts/smoke-strapi-permissions.sh "http://localhost:1337" || {
            echo "::warning::Strapi permission tests skipped (no live CMS in CI)"
          }

  # ==========================================================================
  # JOB 6d: n8n Workflow E2E Smoke Tests (Phase 5 - Plan 05-01/05-02)
  # ==========================================================================
  smoke-n8n-e2e:
    name: n8n E2E Smoke
    runs-on: ubuntu-latest
    needs: [integrity-gate, integration-tests]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate E2E script syntax
        run: bash -n scripts/smoke-n8n-e2e.sh

      - name: Run n8n E2E smoke tests (dry-run)
        run: |
          echo "::notice::n8n E2E tests require live services; validating script syntax and structure"
          chmod +x scripts/smoke-n8n-e2e.sh
          bash scripts/smoke-n8n-e2e.sh "http://localhost:5678" || {
            echo "::warning::n8n E2E tests skipped (no live n8n in CI)"
          }


  test-harness:
    name: Test Harness (Full Stack)
    runs-on: ubuntu-latest
    needs: [integrity-gate, integration-tests]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run test harness
        run: |
          chmod +x scripts/test_harness.sh
          bash scripts/test_harness.sh

      - name: Upload Docker logs on failure
        if: failure()
        run: |
          mkdir -p test-harness-logs
          docker compose -f docker/docker-compose.test.yml logs --no-color > test-harness-logs/compose.log 2>&1 || true
          docker ps -a > test-harness-logs/containers.log 2>&1 || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.0
        with:
          name: test-harness-logs
          path: test-harness-logs/
          retention-days: 14

  # ==========================================================================
  # JOB 8c: n8n Workflow E2E Tests (main/release only, after test-harness)
  # Starts its own compose stack -- CI runners are isolated.
  # CANNOT reuse test_harness.sh because it tears down at step 8.
  # ==========================================================================
  n8n-workflow-e2e:
    name: n8n Workflow E2E
    runs-on: ubuntu-latest
    needs: [integrity-gate, test-harness]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start compose stack and wait for readiness
        run: |
          set -euo pipefail
          COMPOSE_FILE=docker/docker-compose.test.yml

          # Step 1: Start dependencies
          echo "[1/6] Starting postgres + redis + mock-api..."
          docker compose -f "$COMPOSE_FILE" up -d postgres redis mock-api

          echo "Waiting for postgres..."
          for i in $(seq 1 60); do
            if docker compose -f "$COMPOSE_FILE" exec -T postgres sh -lc "psql -U n8n -d n8n -c 'SELECT 1'" >/dev/null 2>&1; then
              echo "postgres ready after $((i * 2))s"
              break
            fi
            sleep 2
            if [ "$i" -eq 60 ]; then echo "FATAL: postgres not ready after 120s"; exit 1; fi
          done

          # Step 1.5: Create strapi DB (needed by migration 006)
          docker compose -f "$COMPOSE_FILE" exec -T postgres sh -lc \
            "psql -U n8n -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'strapi'\" | grep -q 1 || psql -U n8n -d postgres -c 'CREATE DATABASE strapi OWNER n8n;'"

          # Step 2: Apply migrations
          echo "[2/6] Applying migrations..."
          for m in $(ls -1 db/migrations/*.sql 2>/dev/null | sort); do
            echo "  - $m"
            if grep -q '\\c ' "$m"; then
              ./scripts/db_migrate.sh "$COMPOSE_FILE" "$m" || echo "::warning::Cross-database migration had issues: $m"
            else
              ./scripts/db_migrate.sh "$COMPOSE_FILE" "$m"
            fi
          done

          # Step 3: Seed fixtures
          echo "[3/6] Seeding fixtures..."
          for f in $(ls -1 tests/fixtures/*.sql 2>/dev/null | sort); do
            echo "  - $f"
            docker compose -f "$COMPOSE_FILE" exec -T postgres sh -lc "psql -v ON_ERROR_STOP=1 -U n8n -d n8n < /dev/stdin" < "$f"
          done

          # Step 4: Start n8n
          echo "[4/6] Starting n8n..."
          docker compose -f "$COMPOSE_FILE" up -d n8n

          echo "Waiting for n8n to be ready (up to 180s)..."
          for i in $(seq 1 90); do
            resp="$(curl -s "http://localhost:25678/rest/settings" 2>/dev/null || true)"
            if echo "$resp" | jq -e '.data' >/dev/null 2>&1; then
              echo "n8n ready after $((i * 2))s"
              break
            fi
            sleep 2
            if [ "$i" -eq 90 ]; then echo "FATAL: n8n not ready after 180s"; exit 1; fi
          done

      - name: Import and activate workflows
        run: |
          set -euo pipefail
          COMPOSE_FILE=docker/docker-compose.test.yml
          N8N_JAR="/tmp/n8n_cookies"

          # Create owner account
          echo "[5/6] Setting up n8n owner account..."
          for i in $(seq 1 30); do
            setup_status="$(curl -s -o /tmp/n8n_setup_resp.json -w "%{http_code}" -c "$N8N_JAR" \
              -X POST "http://localhost:25678/rest/owner/setup" \
              -H "Content-Type: application/json" \
              -d '{"email":"test@example.com","firstName":"Test","lastName":"User","password":"TestPassw0rd!"}')"
            if [ "$setup_status" = "200" ] || [ "$setup_status" = "400" ]; then break; fi
            sleep 2
            if [ "$i" -eq 30 ]; then echo "Warning: owner setup returned $setup_status"; fi
          done

          # Login
          echo "Logging in to n8n..."
          login_ok=false
          for field in email emailOrLdapLoginId; do
            rm -f "$N8N_JAR"
            code="$(curl -s -o /tmp/n8n_login_resp.json -w "%{http_code}" -c "$N8N_JAR" \
              -X POST "http://localhost:25678/rest/login" \
              -H "Content-Type: application/json" \
              -d "{\"$field\":\"test@example.com\",\"password\":\"TestPassw0rd!\"}")"
            if [ "$code" = "200" ]; then login_ok=true; break; fi
          done
          if [ "$login_ok" != "true" ]; then echo "FATAL: n8n login failed"; exit 1; fi

          # Import workflows
          echo "Importing workflows..."
          import_wf() {
            local wf_file="$1" label="$2" active="${3:-false}"
            jq "del(.id) | .active = $active" "$wf_file" > /tmp/_wf_payload.json
            local http_code
            http_code="$(curl -s -o /tmp/_wf_resp.json -w "%{http_code}" -b "$N8N_JAR" \
              -X POST "http://localhost:25678/rest/workflows" \
              -H "Content-Type: application/json" \
              -d @/tmp/_wf_payload.json)"
            local wf_id
            wf_id="$(jq -r '.data.id // .id // empty' /tmp/_wf_resp.json 2>/dev/null)"
            if [ -n "$wf_id" ] && [ "$wf_id" != "null" ]; then
              echo "  $label -> id=$wf_id"
              printf "%s" "$wf_id"
            else
              echo "::warning::Failed to import $label (HTTP $http_code)"
              return 1
            fi
          }

          # Import W4_CORE first (needed by other workflows)
          CORE_ID="$(import_wf workflows/W4_CORE.json "W4_CORE" false)" || true
          export CORE_WORKFLOW_ID="${CORE_ID:-}"

          # Import webhook workflows (inactive, then activate via DB)
          WEBHOOK_IDS=""
          for wf in W1_IN_WA.json W2_IN_IG.json W3_IN_MSG.json W9_ADMIN_PING.json; do
            wf_id="$(import_wf "workflows/$wf" "$wf" false 2>/dev/null)" || continue
            WEBHOOK_IDS="$WEBHOOK_IDS $wf_id"
          done

          # Import W15_OUTBOX_WORKER (needed for TEST-10)
          W15_ID="$(import_wf workflows/W15_OUTBOX_WORKER.json "W15_OUTBOX_WORKER" false)" || true
          echo "W15_OUTBOX_WORKER ID: ${W15_ID:-FAILED}"

          # Create Redis credential for W15 (REDIS_CREDENTIAL_ID env var must match)
          echo "Creating Redis credential..."
          REDIS_CRED_RESP="$(curl -s -o /tmp/_redis_cred.json -w "%{http_code}" -b "$N8N_JAR" \
            -X POST "http://localhost:25678/rest/credentials" \
            -H "Content-Type: application/json" \
            -d '{"name":"Redis Test","type":"redis","data":{"host":"redis","port":6379,"db":0}}')"
          REDIS_CRED_ID="$(jq -r '.data.id // .id // empty' /tmp/_redis_cred.json 2>/dev/null)"
          echo "  Redis credential created: id=${REDIS_CRED_ID:-FAILED} (HTTP ${REDIS_CRED_RESP})"

          # If credential ID differs from env default (43SDqJYMGa6RvFqW), update via DB
          if [ -n "${REDIS_CRED_ID}" ] && [ "${REDIS_CRED_ID}" != "null" ] && [ "${REDIS_CRED_ID}" != "43SDqJYMGa6RvFqW" ]; then
            echo "  Updating REDIS_CREDENTIAL_ID in n8n container: ${REDIS_CRED_ID}"
            docker compose -f "$COMPOSE_FILE" stop n8n
            REDIS_CREDENTIAL_ID="${REDIS_CRED_ID}" docker compose -f "$COMPOSE_FILE" up -d n8n
            # Wait for n8n to restart with new env
            for i in $(seq 1 60); do
              resp="$(curl -s "http://localhost:25678/rest/settings" 2>/dev/null || true)"
              if echo "$resp" | jq -e '.data' >/dev/null 2>&1; then break; fi
              sleep 2
            done
          fi

          # Activate webhook workflows via DB
          echo "[6/6] Activating workflows via DB..."
          WH_ID_LIST=""
          for wf_id in $WEBHOOK_IDS; do
            WH_ID_LIST="${WH_ID_LIST}'${wf_id}',"
          done
          WH_ID_LIST="${WH_ID_LIST%,}"
          if [ -n "$WH_ID_LIST" ]; then
            docker compose -f "$COMPOSE_FILE" exec -T postgres sh -lc \
              "psql -U n8n -d n8n -Atc \"UPDATE workflow_entity SET active = true WHERE id IN ($WH_ID_LIST);\""
          fi

          # Also activate W15 if imported
          if [ -n "${W15_ID:-}" ]; then
            docker compose -f "$COMPOSE_FILE" exec -T postgres sh -lc \
              "psql -U n8n -d n8n -Atc \"UPDATE workflow_entity SET active = true WHERE id = '${W15_ID}';\""
          fi

          # Force-restart n8n so init() registers Express routes from active workflows
          echo "Restarting n8n for webhook registration..."
          docker compose -f "$COMPOSE_FILE" stop n8n
          docker compose -f "$COMPOSE_FILE" up -d n8n

          echo "Waiting for n8n to restart..."
          for i in $(seq 1 90); do
            resp="$(curl -s "http://localhost:25678/rest/settings" 2>/dev/null || true)"
            if echo "$resp" | jq -e '.data' >/dev/null 2>&1; then break; fi
            sleep 2
            if [ "$i" -eq 90 ]; then echo "FATAL: n8n did not restart"; exit 1; fi
          done
          sleep 5  # Extra buffer for async webhook registration

          echo "Stack setup complete. Ready for E2E tests."

      - name: Run n8n E2E tests
        run: |
          chmod +x scripts/test-n8n-e2e.sh
          bash scripts/test-n8n-e2e.sh

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          mkdir -p n8n-e2e-logs
          docker compose -f docker/docker-compose.test.yml logs --no-color > n8n-e2e-logs/compose.log 2>&1 || true
          docker ps -a > n8n-e2e-logs/containers.log 2>&1 || true
          docker compose -f docker/docker-compose.test.yml exec -T redis redis-cli LRANGE ralphe:outbox:pending 0 -1 > n8n-e2e-logs/redis-outbox.log 2>&1 || true
          docker compose -f docker/docker-compose.test.yml exec -T redis redis-cli LRANGE ralphe:outbox:dlq 0 -1 > n8n-e2e-logs/redis-dlq.log 2>&1 || true
          docker compose -f docker/docker-compose.test.yml exec -T postgres sh -lc "psql -U n8n -d n8n -c 'SELECT * FROM inbound_messages ORDER BY received_at DESC LIMIT 10;'" > n8n-e2e-logs/inbound-messages.log 2>&1 || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.0
        with:
          name: n8n-e2e-logs
          path: n8n-e2e-logs/
          retention-days: 14

      - name: Tear down compose stack
        if: always()
        run: |
          docker compose -f docker/docker-compose.test.yml down -v --remove-orphans || true

  # ==========================================================================
  # JOB 9: CI Summary
  # ==========================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - integrity-gate
      - lint-validate
      - python-tests
      - integration-tests
      - integration-tests-pg16
      - cms-ts-compile
      - docker-build
      - security-scan
      - frontend-lint
      - test-harness
      - smoke-nginx-routing
      - smoke-strapi-permissions
      - smoke-n8n-e2e
      - n8n-workflow-e2e
    if: always()
    timeout-minutes: 2

    steps:
      - name: Generate summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## CI Pipeline Summary

          | Job | Status |
          |-----|--------|
          | Integrity Gate | ${{ needs.integrity-gate.result == 'success' && 'PASS' || needs.integrity-gate.result }} |
          | Lint & Validate | ${{ needs.lint-validate.result == 'success' && 'PASS' || needs.lint-validate.result }} |
          | Python Tests | ${{ needs.python-tests.result == 'success' && 'PASS' || needs.python-tests.result }} |
          | Integration Tests (PG15) | ${{ needs.integration-tests.result == 'success' && 'PASS' || needs.integration-tests.result }} |
          | Integration Tests (PG16) | ${{ needs.integration-tests-pg16.result == 'success' && 'PASS' || needs.integration-tests-pg16.result }} |
          | CMS TypeScript Compile | ${{ needs.cms-ts-compile.result == 'success' && 'PASS' || needs.cms-ts-compile.result }} |
          | Docker Build | ${{ needs.docker-build.result == 'success' && 'PASS' || needs.docker-build.result }} |
          | Security Scan | ${{ needs.security-scan.result == 'success' && 'PASS' || needs.security-scan.result }} |
          | Frontend Lint | ${{ needs.frontend-lint.result == 'success' && 'PASS' || needs.frontend-lint.result }} |
          | Test Harness | ${{ needs.test-harness.result == 'success' && 'PASS' || needs.test-harness.result }} |
          | n8n Workflow E2E | ${{ needs.n8n-workflow-e2e.result == 'success' && 'PASS' || needs.n8n-workflow-e2e.result }} |

          **Commit:** `${{ github.sha }}`
          **Branch:** `${{ github.ref_name }}`
          **Actor:** ${{ github.actor }}
          EOF

      - name: Fail if critical jobs failed
        if: |
          needs.integrity-gate.result == 'failure' ||
          needs.lint-validate.result == 'failure' ||
          needs.python-tests.result == 'failure' ||
          needs.integration-tests.result == 'failure' ||
          needs.frontend-lint.result == 'failure' ||
          needs.security-scan.result == 'failure' ||
          needs.cms-ts-compile.result == 'failure' ||
          needs.docker-build.result == 'failure'
        run: |
          echo "::error::CI pipeline failed - merge blocked"
          exit 1


