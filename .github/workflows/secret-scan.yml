name: Secret Scan
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Check for common secret patterns
        run: |
          echo "=== Checking for hardcoded secrets ==="
          FOUND=0

          # Exclusions:
          #   :!.github/        — workflow files themselves
          #   :!docs/           — documentation
          #   :!*.md            — markdown files
          #   :!.agent/         — agent runtime binaries (contain sk-* as regex patterns for scrubbing)
          #   :!.claude/        — claude agent binaries (same)
          #   :!.opencode/      — opencode agent binaries (same)
          #   :!.ralph/         — ralph agent binaries
          #   :!tools/          — vendored binaries (gh.exe etc.)
          EXCL=':!.github/ :!docs/ :!*.md :!.agent/ :!.claude/ :!.opencode/ :!.ralph/ :!tools/ :!*.example :!*.env.example'

          # Fixed-string patterns (exact prefix match, low false-positive rate)
          for pattern in "ChangeMeNow" "ghp_" "ghu_" "AKIA"; do
            # shellcheck disable=SC2086
            if git grep -lF "$pattern" -- $EXCL 2>/dev/null; then
              echo "❌ FOUND secret pattern: $pattern"
              FOUND=1
            fi
          done

          # Extended-regex patterns (require minimum length to avoid "kiosk-", "task-", etc.)
          # sk- requires 20+ alphanumeric chars after the prefix (OpenAI / generic API key format)
          # shellcheck disable=SC2086
          if git grep -lE 'sk-[a-zA-Z0-9]{20,}' -- $EXCL 2>/dev/null; then
            echo "❌ FOUND secret pattern: sk-<key>"
            FOUND=1
          fi

          # BEGIN KEY — only flag if it looks like a real PEM key block
          # shellcheck disable=SC2086
          if git grep -lE '\-\-\-\-\-BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY\-\-\-\-\-' -- $EXCL 2>/dev/null; then
            echo "❌ FOUND secret pattern: PEM private key"
            FOUND=1
          fi

          # Check for tracked env files
          if git ls-files | grep -E '\.env\.(production|staging)$'; then
            echo "❌ FOUND tracked env file with secrets"
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Secret patterns detected. See output above."
            exit 1
          fi

          echo "✅ No secret patterns found"
