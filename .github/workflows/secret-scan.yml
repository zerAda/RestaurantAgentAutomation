name: Secret Scan
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Check for common secret patterns
        run: |
          echo "=== Checking for hardcoded secrets ==="
          FOUND=0
          
          # Check for env files with real values
          for pattern in "ChangeMeNow" "sk-" "ghp_" "ghu_" "AKIA" "-----BEGIN.*KEY-----"; do
            if git grep -l "$pattern" -- ':!.github/' ':!docs/' ':!*.md' 2>/dev/null; then
              echo "❌ FOUND secret pattern: $pattern"
              FOUND=1
            fi
          done
          
          # Check for tracked env files
          if git ls-files | grep -E '\.env\.(production|staging)$'; then
            echo "❌ FOUND tracked env file with secrets"
            FOUND=1
          fi
          
          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Secret patterns detected. See output above."
            exit 1
          fi
          
          echo "✅ No secret patterns found"
