# infra/gateway/nginx.smoke.conf
# CI smoke test nginx config — all production security rules, stub upstreams.
# Mount as /etc/nginx/conf.d/default.conf in nginx:1.27-alpine.
# DO NOT use in production.

# Rate limiting zones (verbatim from nginx.conf)
limit_req_zone $binary_remote_addr zone=meta_inbound:10m rate=10r/s;
limit_req_zone $http_x_api_token zone=internal_token:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_zone $binary_remote_addr zone=kiosk_menu:10m rate=30r/s;

server {
  listen 8080;
  server_tokens off;

  client_max_body_size 1m;
  limit_conn conn_per_ip 50;

  # Security headers (verbatim from nginx.conf)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer" always;

  # P0-SEC-01: Block query string tokens
  set $query_token_blocked 0;
  if ($arg_token) { set $query_token_blocked 1; }
  if ($arg_access_token) { set $query_token_blocked 1; }
  if ($arg_api_token) { set $query_token_blocked 1; }
  if ($arg_webhook_token) { set $query_token_blocked 1; }

  # Zone 1: /healthz
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Zone 1b: /healthz/deep
  location = /healthz/deep {
    limit_except GET { deny all; }
    add_header Content-Type text/plain;
    return 200 'smoke-stub';
  }

  # Zone 2/3: /v1/inbound/whatsapp (rate limit + content-type guard)
  location = /v1/inbound/whatsapp {
    limit_except GET POST { deny all; }
    if ($query_token_blocked) {
      add_header Content-Type application/json always;
      return 401 '{"error":"query_token_not_allowed"}';
    }
    set $content_type_ok 1;
    if ($request_method = POST) { set $content_type_ok 0; }
    if ($http_content_type ~* "application/json") { set $content_type_ok 1; }
    if ($content_type_ok = 0) {
      add_header Content-Type application/json always;
      return 415 '{"error":"unsupported_media_type"}';
    }
    limit_req zone=meta_inbound burst=20 nodelay;
    add_header Content-Type application/json always;
    return 200 '{"ok":true,"stub":true}';
  }

  # Zone 4: /v1/inbound/instagram (same pattern)
  location = /v1/inbound/instagram {
    limit_except GET POST { deny all; }
    if ($query_token_blocked) {
      add_header Content-Type application/json always;
      return 401 '{"error":"query_token_not_allowed"}';
    }
    set $content_type_ok 1;
    if ($request_method = POST) { set $content_type_ok 0; }
    if ($http_content_type ~* "application/json") { set $content_type_ok 1; }
    if ($content_type_ok = 0) {
      add_header Content-Type application/json always;
      return 415 '{"error":"unsupported_media_type"}';
    }
    limit_req zone=meta_inbound burst=20 nodelay;
    add_header Content-Type application/json always;
    return 200 '{"ok":true,"stub":true}';
  }

  # Zone 5: /v1/inbound/messenger (same pattern)
  location = /v1/inbound/messenger {
    limit_except GET POST { deny all; }
    if ($query_token_blocked) {
      add_header Content-Type application/json always;
      return 401 '{"error":"query_token_not_allowed"}';
    }
    set $content_type_ok 1;
    if ($request_method = POST) { set $content_type_ok 0; }
    if ($http_content_type ~* "application/json") { set $content_type_ok 1; }
    if ($content_type_ok = 0) {
      add_header Content-Type application/json always;
      return 415 '{"error":"unsupported_media_type"}';
    }
    limit_req zone=meta_inbound burst=20 nodelay;
    add_header Content-Type application/json always;
    return 200 '{"ok":true,"stub":true}';
  }

  # Zone 6: /v1/customer/
  location ^~ /v1/customer/ {
    limit_req zone=internal_token burst=50 nodelay;
    add_header Content-Type application/json always;
    return 200 '{"ok":true,"stub":true}';
  }

  # Zone 7: /v1/admin/
  location ^~ /v1/admin/ {
    limit_req zone=internal_token burst=50 nodelay;
    add_header Content-Type application/json always;
    return 200 '{"ok":true,"stub":true}';
  }

  # Zone 7b: /v1/internal/
  location ^~ /v1/internal/ {
    limit_req zone=internal_token burst=50 nodelay;
    add_header Content-Type application/json always;
    return 200 '{"ok":true,"stub":true}';
  }

  # Zone 8a: /v1/strapi/api/orders (POST only — order creation)
  location = /v1/strapi/api/orders {
    limit_except POST OPTIONS { deny all; }
    limit_req zone=kiosk_menu burst=20 nodelay;
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "https://kiosk.srv1258231.hstgr.cloud" always;
      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      return 204;
    }
    add_header Access-Control-Allow-Origin "https://kiosk.srv1258231.hstgr.cloud" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Content-Type application/json always;
    return 200 '{"data":{"id":1},"stub":true}';
  }

  # Zone 8b: /v1/strapi/ (GET-only kiosk proxy — CORS header is the test target)
  location ^~ /v1/strapi/ {
    limit_except GET OPTIONS { deny all; }
    limit_req zone=kiosk_menu burst=60 nodelay;
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "https://kiosk.srv1258231.hstgr.cloud" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      return 204;
    }
    # CRITICAL: do NOT add proxy_hide_header here (no upstream) — nginx adds exactly one ACAO
    add_header Access-Control-Allow-Origin "https://kiosk.srv1258231.hstgr.cloud" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Content-Type application/json always;
    return 200 '{"data":[],"stub":true}';
  }

  # Zone 9: /v1/portal/ (admin dashboard full CRUD)
  location ^~ /v1/portal/ {
    limit_except GET POST PUT PATCH DELETE OPTIONS { deny all; }
    limit_req zone=internal_token burst=50 nodelay;
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "https://admin.srv1258231.hstgr.cloud" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      return 204;
    }
    add_header Access-Control-Allow-Origin "https://admin.srv1258231.hstgr.cloud" always;
    add_header Content-Type application/json always;
    return 200 '{"ok":true,"stub":true}';
  }

  # Default deny
  location / {
    return 404;
  }
}
