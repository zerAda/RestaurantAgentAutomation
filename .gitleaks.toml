# =============================================================================
# Gitleaks Configuration - Resto Bot
# =============================================================================
# Custom rules for secret detection
# https://github.com/gitleaks/gitleaks
# =============================================================================

title = "Resto Bot Secret Detection"

[extend]
useDefault = true

# Additional rules specific to this project
[[rules]]
id = "resto-bot-webhook-token"
description = "Resto Bot Webhook Token"
regex = '''WEBHOOK_SHARED_TOKEN\s*=\s*["']?([^"'\s]{20,})["']?'''
secretGroup = 1
tags = ["token", "webhook"]

[[rules]]
id = "meta-app-secret"
description = "Meta/WhatsApp App Secret"
regex = '''META_APP_SECRET\s*=\s*["']?([a-f0-9]{32,})["']?'''
secretGroup = 1
tags = ["meta", "secret"]

[[rules]]
id = "n8n-encryption-key"
description = "n8n Encryption Key"
regex = '''N8N_ENCRYPTION_KEY\s*=\s*["']?([^"'\s]{16,})["']?'''
secretGroup = 1
tags = ["n8n", "encryption"]

[[rules]]
id = "postgres-password"
description = "PostgreSQL Password"
regex = '''POSTGRES_PASSWORD\s*=\s*["']?([^"'\s]{8,})["']?'''
secretGroup = 1
tags = ["database", "password"]

[[rules]]
id = "api-token-header"
description = "API Token in Header"
regex = '''x-webhook-token:\s*["']?([^"'\s]{20,})["']?'''
secretGroup = 1
tags = ["api", "token"]

# Allowlist - files and patterns to ignore
[allowlist]
description = "Allowlist for known safe patterns"

paths = [
  '''\.env\.example$''',
  '''config/\.env\.example$''',
  '''tests/fixtures/.*\.sql$''',
  '''tests/.*\.md$''',
  '''\.gitleaks\.toml$''',
  '''CHANGELOG\.md$''',
  '''PATCHLOG\.md$''',
  '''PATCH\.diff$''',
  '''mock-api/.*''',
  '''scripts/smoke/.*''',
  '''scripts/smoke\.sh$''',
  '''scripts/smoke_security_gateway\.sh$''',
  '''docs/.*\.md$''',
  '''RUNBOOK\.md$''',
  '''TEST_REPORT\.md$''',
  '''docker-compose\..*\.yml$''',
  '''agents/.*''',
  '''\.claude/.*'''
]

regexes = [
  '''CHANGE_ME''',
  '''your-.*-here''',
  '''example\.com''',
  '''localhost''',
  '''127\.0\.0\.1''',
  '''REPLACE_WITH_.*''',
  '''tobemodified''',
  '''\$\{[A-Z_]+:-?\}''',
  '''test-token-\w+''',
  '''YOUR_\w*TOKEN''',
  '''YOUR_\w*KEY''',
  '''yourdomain\.com''',
  '''CHANGEME_\w+''',
  '''valid-token''',
  '''invalid-token''',
  '''LEGACY_SHARED_TOKEN''',
  '''CLIENT_SPECIFIC_TOKEN''',
  '''OLD_SHARED_TOKEN''',
  '''NEW_SECURE_TOKEN''',
  '''dummy[\-_]?\w*''',
  '''placeholder[\-_]?\w*'''
]

# Specific commits to ignore (if needed)
commits = []
